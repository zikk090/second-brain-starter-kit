<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated node graph, similar to Obsidian's graph view">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1b1530"/>
      <stop offset="100%" stop-color="#0d0a17"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7b8ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="url(#bg)"/>

  <!-- edges (base, dim) -->
  <g stroke="#4a3f78" stroke-width="1.4" opacity="0.55">
    <line x1="90" y1="210" x2="170" y2="110"/>
    <line x1="90" y1="210" x2="230" y2="290"/>
    <line x1="170" y1="110" x2="330" y2="80"/>
    <line x1="230" y1="290" x2="360" y2="230"/>
    <line x1="230" y1="290" x2="300" y2="330"/>
    <line x1="330" y1="80" x2="360" y2="230"/>
    <line x1="330" y1="80" x2="470" y2="140"/>
    <line x1="360" y1="230" x2="300" y2="330"/>
    <line x1="360" y1="230" x2="500" y2="290"/>
    <line x1="470" y1="140" x2="610" y2="190"/>
    <line x1="470" y1="140" x2="500" y2="290"/>
    <line x1="500" y1="290" x2="650" y2="320"/>
    <line x1="610" y1="190" x2="650" y2="320"/>
    <line x1="610" y1="190" x2="700" y2="110"/>
    <line x1="650" y1="320" x2="700" y2="110"/>
  </g>

  <!-- edges (animated traveling pulse, drawn on top) -->
  <g fill="none" stroke="#c7b8ff" stroke-width="2" stroke-linecap="round">
    <line x1="90" y1="210" x2="170" y2="110" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="4.2s" begin="0s" repeatCount="indefinite"/></line>
    <line x1="90" y1="210" x2="230" y2="290" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="5.1s" begin="0.6s" repeatCount="indefinite"/></line>
    <line x1="170" y1="110" x2="330" y2="80" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></line>
    <line x1="230" y1="290" x2="360" y2="230" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="4.8s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="230" y1="290" x2="300" y2="330" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="3.9s" begin="1.6s" repeatCount="indefinite"/></line>
    <line x1="330" y1="80" x2="360" y2="230" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="5.4s" begin="0.9s" repeatCount="indefinite"/></line>
    <line x1="330" y1="80" x2="470" y2="140" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="4.1s" begin="2s" repeatCount="indefinite"/></line>
    <line x1="360" y1="230" x2="300" y2="330" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></line>
    <line x1="360" y1="230" x2="500" y2="290" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="4.7s" begin="1.4s" repeatCount="indefinite"/></line>
    <line x1="470" y1="140" x2="610" y2="190" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="5.6s" begin="0.5s" repeatCount="indefinite"/></line>
    <line x1="470" y1="140" x2="500" y2="290" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="3.8s" begin="1.8s" repeatCount="indefinite"/></line>
    <line x1="500" y1="290" x2="650" y2="320" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="4.4s" begin="0.7s" repeatCount="indefinite"/></line>
    <line x1="610" y1="190" x2="650" y2="320" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="5.9s" begin="1.2s" repeatCount="indefinite"/></line>
    <line x1="610" y1="190" x2="700" y2="110" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="4.0s" begin="0.4s" repeatCount="indefinite"/></line>
    <line x1="650" y1="320" x2="700" y2="110" stroke-dasharray="5 600"><animate attributeName="stroke-dashoffset" values="0;-605" dur="5.2s" begin="1.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- nodes -->
  <g fill="url(#nodeGlow)">
    <circle cx="90" cy="210" r="5"><animate attributeName="r" values="5;7;5" dur="3.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="110" r="5"><animate attributeName="r" values="5;7;5" dur="2.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="290" r="6"><animate attributeName="r" values="6;8.5;6" dur="3.6s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="3.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="80" r="5"><animate attributeName="r" values="5;7;5" dur="3.0s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="3.0s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="230" r="7"><animate attributeName="r" values="7;9.5;7" dur="4.0s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;1;0.8" dur="4.0s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="330" r="5"><animate attributeName="r" values="5;7;5" dur="3.3s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="140" r="6"><animate attributeName="r" values="6;8.5;6" dur="3.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="290" r="5"><animate attributeName="r" values="5;7;5" dur="2.9s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="2.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="190" r="6"><animate attributeName="r" values="6;8.5;6" dur="3.7s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="3.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="320" r="5"><animate attributeName="r" values="5;7;5" dur="3.1s" begin="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="3.1s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="110" r="5"><animate attributeName="r" values="5;7;5" dur="2.7s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.75;1;0.75" dur="2.7s" begin="1.0s" repeatCount="indefinite"/></circle>
  </g>
</svg>
